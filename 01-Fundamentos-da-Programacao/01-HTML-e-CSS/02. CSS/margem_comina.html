<!-- Margin Collapse -->
<html>
    <head>
        <title>Margin Collapse</title>
        <style>
            body {
                color: white;
            }
            .azul {
                background-color: blue;
                
            }
            .vermelho {
                background-color: red;
                
            }
            .amarelo{
                background-color: yellow;
                
            }
            .verde {
                background-color: green;

            }
            div,span {
                padding: 5px;
                margin: 5px;
            }
        </style>
    </head>
    <body>
        <!-- inline -->
        <span class="azul">D</span><span class="vermelho">A</span><span class="amarelo">V</span><span class="verde">I</span>
        <hr>
        <div class="azul">A</div>
        <div class="vermelho">D</div>
        <div class="amarelo">V</div>
        <div class="verde">I</div>

    </body>
    <br><br><br>
    <a href="./exercicios-html-css.html">Voltar</a>
</html>
